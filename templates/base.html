<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hallmark — Your mark of authenticity.{% endblock %}</title>
  <link rel="icon" href="{{ url_for('assets', name='hallmark-logo.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    <span class="foot-mark">Hallmark</span> · Your mark of authenticity. · Evidence-based estimate, not a legal verification.
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
